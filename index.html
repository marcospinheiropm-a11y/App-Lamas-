<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Maturação de Barris Lamas</title>
  <link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22Controle%20de%20Barris%22,%22short_name%22:%22Barris%22,%22start_url%22:%22./%22,%22display%22:%22standalone%22,%22background_color%22:%22#2b1d0c%22,%22theme_color%22:%22#2b1d0c%22}">
  <style>
    :root {
      --primary: #5c3a21;
      --secondary: #8c5a2b;
      --bg: #f8f5f0;
      --card-bg: #ffffff;
      --text: #2c2523;
      --accent: #b33939;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    h1, h2, h3 {
      color: var(--primary);
      margin-top: 0;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      background-color: var(--primary);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:active {
      background-color: var(--secondary);
    }
    .hidden { display: none; }
    .barrel-card {
      border-left: 5px solid var(--secondary);
      margin-top: 10px;
      padding: 12px;
      background: #fafafa;
      border-radius: 4px;
    }
    .error { color: var(--accent); font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Tela de Login -->
    <div id="auth-screen" class="card">
      <h2>Acesso ao Sistema</h2>
      <input type="email" id="email" placeholder="E-mail">
      <input type="password" id="password" placeholder="Senha (mínimo 6 caracteres)">
      <button onclick="login()">Entrar</button>
      <button onclick="register()" style="background-color: var(--secondary);">Cadastrar Novo Usuário</button>
      <div id="auth-error" class="error"></div>
    </div>

    <!-- Tela Principal -->
    <div id="main-screen" class="card hidden">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>Barris Lamas</h1>
        <button onclick="logout()" style="width:auto; padding:6px 12px;">Sair</button>
      </div>

      <!-- Formulário de Cadastro de Barril -->
      <div class="card" style="background:#f0e6df;">
        <h3>Cadastrar Barril / Lote</h3>
        <input type="text" id="barrel-id" placeholder="Identificação do Barril (ex: Barril 01)">
        <input type="text" id="beer-type" placeholder="Tipo de Cerveja / Bebida">
        <input type="date" id="entry-date" placeholder="Data de Entrada">
        <input type="number" id="maturation-days" placeholder="Dias de Maturação Previstos">
        <button onclick="addBarrel()">Salvar Registros</button>
      </div>

      <!-- Listagem de Barris -->
      <h2>Barris em Maturação</h2>
      <div id="barrel-list">Carregando barris...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuração Atualizada
    const firebaseConfig = {
      apiKey: "AIzaSyDJXXWjAZSPHITM2CtKy5jdPj9hk_dotIE",
      authDomain: "controle-lamas.firebaseapp.com",
      projectId: "controle-lamas",
      storageBucket: "controle-lamas.firebasestorage.app",
      messagingSenderId: "415984147364",
      appId: "1:415984147364:web:b754cbe19ed4591ab6ff31"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.login = async () => {
      const e = document.getElementById("email").value;
      const p = document.getElementById("password").value;
      try {
        await signInWithEmailAndPassword(auth, e, p);
      } catch (err) {
        document.getElementById("auth-error").innerText = err.message;
      }
    };

    window.register = async () => {
      const e = document.getElementById("email").value;
      const p = document.getElementById("password").value;
      try {
        await createUserWithEmailAndPassword(auth, e, p);
      } catch (err) {
        document.getElementById("auth-error").innerText = err.message;
      }
    };

    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("auth-screen").classList.add("hidden");
        document.getElementById("main-screen").classList.remove("hidden");
        loadBarrels();
      } else {
        document.getElementById("auth-screen").classList.remove("hidden");
        document.getElementById("main-screen").classList.add("hidden");
      }
    });

    window.addBarrel = async () => {
      const id = document.getElementById("barrel-id").value;
      const beer = document.getElementById("beer-type").value;
      const date = document.getElementById("entry-date").value;
      const days = document.getElementById("maturation-days").value;

      if (!id || !beer || !date) return alert("Preencha os campos obrigatórios!");

      await addDoc(collection(db, "barris"), {
        barrelId: id,
        beerType: beer,
        entryDate: date,
        maturationDays: days,
        createdAt: new Date()
      });

      document.getElementById("barrel-id").value = "";
      document.getElementById("beer-type").value = "";
    };

    function loadBarrels() {
      const q = query(collection(db, "barris"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const list = document.getElementById("barrel-list");
        list.innerHTML = "";
        snapshot.forEach((doc) => {
          const data = doc.data();
          list.innerHTML += `
            <div class="barrel-card">
              <strong>${data.barrelId}</strong> - ${data.beerType}<br>
              <small>Entrada: ${data.entryDate} | Maturação: ${data.maturationDays || 0} dias</small>
            </div>
          `;
        });
      });
    }
  </script>
</body>
</html>
